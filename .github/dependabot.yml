# Dependabot configuration
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Safety principles used throughout:
#   - Weekly schedule, so updates arrive in a predictable, reviewable batch.
#   - Cooldown: wait for a release to "settle" before proposing it. Freshly
#     published versions are where most supply-chain attacks and broken
#     releases show up, and they are usually yanked within days.
#   - Minor/patch updates are grouped into one PR per ecosystem/directory to
#     cut noise; major updates get their own PRs so breaking changes are
#     reviewed individually.
#   - Open PR limits stop a backlog from piling up.
#   - Security updates (enabled in repo settings) are NOT delayed by the
#     schedule or cooldown and are raised as soon as an advisory is published.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm — backend
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
      prefix-development: "deps-dev(backend)"
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # npm — frontend
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
      prefix-development: "deps-dev(frontend)"
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Docker base images (backend + frontend Dockerfiles)
  # Major bumps (e.g. node:20 -> node:25) are ignored: Dependabot doesn't know
  # which Node majors are LTS, so moving to a new major is a manual decision.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # docker-compose images (redis)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(compose)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions used in .github/workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
