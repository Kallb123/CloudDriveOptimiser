# When TLS is terminated by an outer reverse proxy (Caddy, Traefik, Cloudflare,
# etc.), keep the scheme/host it reports so the backend builds the OAuth
# redirect URI from the public HTTPS URL rather than this container's http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and auth calls to the backend service
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header Cookie $http_cookie;
    }

    location /csrf-token {
        proxy_pass http://backend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header Cookie $http_cookie;
        # Allow large uploads / downloads
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 10g;
    }

    # All other requests → serve the Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
